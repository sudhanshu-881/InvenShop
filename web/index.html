<!DOCTYPE html>
<html>
<head>
  <base href="/" />
  
  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="InvenShop - Your Digital Shop Assistant for Indian Retail" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2E7D32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="InvenShop" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- Favicon and Icons -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  
  <title>InvenShop - Digital Shop Assistant</title>
  
  <!-- Loading Styles -->
  <style>
    body {
      background: linear-gradient(135deg, #2E7D32 0%, #4CAF50 100%);
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2E7D32 0%, #4CAF50 100%);
      z-index: 9999;
    }

    .logo {
      font-size: 3rem;
      font-weight: bold;
      color: white;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .loader {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #FF6B35;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    .loading-text {
      color: white;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-container">
    <div class="logo">🏪 InvenShop</div>
    <div class="loader"></div>
    <div class="loading-text">Loading your digital shop assistant...</div>
  </div>

  <!-- Flutter App Container -->
  <div id="app"></div>

  <!-- Flutter Scripts -->
  <script src="flutter.js" defer></script>
  <script>
    // Flutter app initialization
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Hide loading screen
            const loadingContainer = document.getElementById('loading-container');
            if (loadingContainer) {
              loadingContainer.classList.add('fade-out');
              setTimeout(() => {
                loadingContainer.style.display = 'none';
              }, 500);
            }
            
            // Start the Flutter app
            appRunner.runApp();
          });
        }
      });
    });

    // Error handling
    window.addEventListener('error', function(e) {
      console.error('Flutter web error:', e.error);
      const loadingContainer = document.getElementById('loading-container');
      if (loadingContainer) {
        loadingContainer.innerHTML = `
          <div class="logo">🏪 InvenShop</div>
          <div style="color: #ff6b6b; text-align: center; margin-top: 1rem;">
            <p>Failed to load the application.</p>
            <p>Please refresh the page or try again later.</p>
            <button onclick="location.reload()" style="
              background: #FF6B35; 
              color: white; 
              border: none; 
              padding: 10px 20px; 
              border-radius: 5px; 
              cursor: pointer;
              margin-top: 1rem;
            ">Refresh Page</button>
          </div>
        `;
      }
    });

    // PWA installation prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // Show install button (optional)
      console.log('PWA install prompt available');
    });

    // Service worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
</body>
</html>
